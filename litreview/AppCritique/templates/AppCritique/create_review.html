{% extends 'AppCritique/base.html' %}

{% block content %}

<div class="bg-white p-6 rounded shadow mb-6">

    <h2 class="text-xl font-bold">
        {{ ticket.title }}
    </h2>

    <p>
        {{ ticket.description }}
    </p>

</div>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded"
    >
        Publier
    </button>

</form>

{% endblock %}
