{% extends 'AppCritique/base.html' %}

{% block content %}

<h1 class="text-4xl font-bold text-gray-800 mb-10">
    Abonnements
</h1>

<!-- FORMULAIRE -->
<div class="bg-white rounded-2xl shadow-md p-6 mb-10">

    <form method="POST" class="flex gap-4">

        {% csrf_token %}

        <input
            type="text"
            name="followed_user"
            placeholder="Nom utilisateur"
            class="flex-1 border border-gray-300 rounded-xl px-4 py-3"
        >

        <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl transition"
        >
            Suivre
        </button>

    </form>

</div>

<!-- LISTE -->
<div class="bg-white rounded-2xl shadow-md p-6">

    <h2 class="text-2xl font-bold mb-6">
        Utilisateurs suivis
    </h2>

    {% for follow in follows %}

    <div class="flex justify-between items-center border-b py-4">

        <span class="font-medium">
            {{ follow.followed_user.username }}
        </span>

        <a
            href="{% url 'unfollow_user' follow.id %}"
            class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition"
        >
            Désabonner
        </a>
    </div>

    {% empty %}

    <p class="text-gray-500">
        Aucun abonnement.   
    </p>

    {% endfor %}

</div>

{% endblock %}
