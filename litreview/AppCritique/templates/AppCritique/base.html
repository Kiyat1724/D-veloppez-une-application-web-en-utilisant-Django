<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LITReview{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'AppCritique/css/base.css' %}">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-white p-4 shadow-md mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600">LITReview</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="mr-4 text-gray-700 font-medium">Bonjour, {{ user.username }}</span>
                    <a href="{% url 'feed' %}"class="mr-4 text-blue-500 hover:underline">Flux</a>
                    <a href="{% url 'posts' %}"class="mr-4 text-blue-500 hover:underline">Posts</a>
                    <a href="{% url 'subscriptions' %}" class="text-red-500 hover:underline">Mes abonnements</a>
                    <a href="{% url 'logout' %}" class="text-red-500 hover:underline">Se déconnecter</a>
                {% else %}
                    <a href="{% url 'login' %}" class="mr-4 text-blue-500 hover:underline">Connexion</a>
                    <a href="{% url 'signup' %}" class="bg-blue-500 text-white px-4 py-2 rounded">S'inscrire</a> 

                {% endif %}
            </div>
        </div>
    </nav>

   <main class="container mx-auto px-4">

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 p-4 rounded-xl shadow
                {% if message.tags == 'success' %}
                    bg-green-100 text-green-800 border border-green-300
                {% elif message.tags == 'error' %}
                    bg-red-100 text-red-800 border border-red-300
                {% endif %}
            ">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
