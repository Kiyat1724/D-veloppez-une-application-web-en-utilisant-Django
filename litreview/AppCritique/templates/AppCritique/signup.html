<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Inscription</title>
</head>

<body class="bg-gray-900 text-white">

<div class="flex min-h-screen items-center justify-center">

    <div class="w-full max-w-sm">

        <h1 class="text-2xl font-bold text-center mb-6">
            Créer un compte
        </h1>

        <form method="post" class="space-y-4">

            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block mb-1 text-white">
                    Nom d'utilisateur
                </label>

                {{ form.username }}
            </div>

            <!-- Email -->
            <div>
                <label class="block mb-1 text-white">
                    Email
                </label>

                {{ form.email }}
            </div>

            <!-- Password -->
            <div>
                <label class="block mb-1 text-white">
                    Mot de passe
                </label>

                {{ form.password1 }}
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block mb-1 text-white">
                    Confirmation
                </label>

                {{ form.password2 }}
            </div>

            <button type="submit"
                class="w-full bg-indigo-500 hover:bg-indigo-400 py-2 rounded-md font-semibold text-white">

                S'inscrire

            </button>

        </form>

    </div>

</div>

</body>
</html>
